<div id="erp-ai-header">

    <div id="erp-ai-title">

        <div id="erp-ai-logo">
            🤖
        </div>

        <div>

            <div class="erp-ai-name">
                ERP Assistant
            </div>

            <div class="erp-ai-status">
                Online
            </div>

        </div>

    </div>

    <div id="erp-ai-actions">

        <button id="erp-ai-minimize">—</button>

        <button id="erp-ai-close">✕</button>

    </div>

</div>

<div id="erp-ai-body">

    <div id="erp-ai-welcome">

        <h2>
            👋 Welcome to ERP AI
        </h2>

        <p>
            How can I assist you with your workflows today?
        </p>

        <div id="erp-ai-suggestions">

            <button
                class="erp-ai-suggestion"
                data-message="Explain current document">

                📄 Explain current document

            </button>

            <button
                class="erp-ai-suggestion"
                data-message="Analyze current page">

                📊 Analyze current page

            </button>

            <button
                class="erp-ai-suggestion"
                data-message="Find customer">

                👤 Find customer

            </button>

            <button
                class="erp-ai-suggestion"
                data-message="Draft email">

                ✉ Draft email

            </button>

        </div>

    </div>

    <div id="erp-ai-messages"></div>

</div>

<div id="erp-ai-footer">

    <div class="erp-ai-input-wrapper">

        <textarea
            id="erp-ai-input"
            rows="1"
            placeholder="Ask anything..."
        ></textarea>

        <button id="erp-ai-send">

            ➜

        </button>

    </div>

</div>
